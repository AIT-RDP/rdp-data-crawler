version: 1
data sources:
  entsoe.DA:
    type: "data_crawler.sources.entsoe_da.ENTSOEDATransparency"
    source parameter:
      api_key: !env-template "${DATA_CRAWLER_ENTSO_E_API_KEY}"
      day_ahead_prices:
        - country_code: "AT"
          timezone: "Europe/Vienna"
    redis:
      stream: "measurements.entsoe"
    polling:  # Polling interval specification
      frequency: 2h
      offset: 0s  # Offset starting from epoch
redis:
  host: !env-template "${DATA_CRAWLER_REDIS_HOST}"
  port: !env-template "${DATA_CRAWLER_REDIS_PORT}"
  db: !env-template "${DATA_CRAWLER_REDIS_DB}"
