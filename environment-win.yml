name: e3-data-crawler
channels:
  - defaults
dependencies:
  - python=3.10
  - pytest=7.1
  - requests=2.28
  - cachecontrol=0.12
  - lockfile=0.12
  - pandas=1.5.3
  - click=8.0.4
  - pip=21.2
  - pip:
      # Providing the token for the pyrdp-commons repo. Please avoid such constructs when switching to poetry.
      - --extra-index-url https://gitlab-intern.ait.ac.at/api/v4/projects/3611/packages/pypi/simple
      - redis==4.3
      - hiredis==2.0
      - versioneer==0.22  # Not needed for productive use
      - prometheus-client==0.14.1
      - jsonpath-rw==1.4
      - pymodbus==3.2.2
      - git+https://gitlab-intern.ait.ac.at/ees-lachs/modbus-crawler@master
      - pyrdp-commons==0.0.0.post26.dev0+c87af5c
