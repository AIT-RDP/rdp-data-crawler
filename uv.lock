[[package]]
name = "rdp-data-crawler"
version = "0.4.0"
source = { editable = "." }
dependencies = [
    { name = "aiofiles" },
    { name = "cachecontrol" },
    { name = "click" },
    { name = "entsoe-py" },
    { name = "filelock" },
    { name = "hiredis" },
    { name = "influxdb-client" },
    { name = "jsonpath-ng" },
    { name = "lockfile" },
    { name = "pandas" },
    { name = "prometheus-client" },
    { name = "pydantic" },
    { name = "pyrdp-commons" },
    { name = "redis" },
    { name = "requests" },
]

[package.optional-dependencies]
modbus = [
    { name = "modbus-crawler" },
    { name = "pandera" },
]
mqtt = [
    { name = "rdp-mqtt" },
]
numerics = [
    { name = "h5netcdf", extra = ["h5py"] },
    { name = "xarray" },
]
opcua = [
    { name = "asyncua" },
    { name = "pandera" },
]
rest-server = [
    { name = "fastapi" },
    { name = "uvicorn" },
]
websocket = [
    { name = "websocket-client" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pytest-mock" },
    { name = "tenacity" },
]

