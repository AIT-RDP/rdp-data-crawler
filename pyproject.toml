[tool.poetry]
name = "rdp-data-crawler"
version = "0.4.0"
description = "Data crawler that actively polls data sources and pushes the results to redis."
authors = ["Michael Spiegel <michael.spiegel@ait.ac.at>"]
readme = "README.md"
packages = [{include = "data_crawler"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.31"
cachecontrol = "~0"
lockfile = "^0.12.2"
pandas = "^2.2.0"
click = "^8.1.7"
redis = "^5.0"
hiredis = "^2.3.2"
prometheus-client = "~0"
pyrdp-commons = {version = "=0.0.0.post77.dev0+2754b1b", source = "gitlab-pyrdp-commons"}
modbus-crawler = {git = "https://gitlab-intern.ait.ac.at/ees-lachs/modbus-crawler", rev = "f989b99687c0fe400ba6c3af5a23a1cf62dec7e9", optional = true}
filelock = "^3.13.1"
entsoe-py = "~0"
pydantic = "^2.6"
jsonpath-ng = "^1.6.1"
aiofiles = "^24.1.0"
xarray = {version = "^2024.6.0", optional = true}
h5netcdf = {version = "^1.3.0", optional = true}
fastapi = {version = "^0.111.1", optional = true}
uvicorn = {version = "^0.30.1", optional = true}
asyncua = {version = "^1.1.5", optional = true}
pandera = {version = "^0.20.3", optional = true}

[tool.poetry.extras]
modbus = ["modbus-crawler", "pandera"]
numerics = ["xarray", "h5netcdf"]
rest-server = ["fastapi", "uvicorn"]
opcua = ["asyncua", "pandera"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.1"
pytest-mock = "^3.12.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
tenacity = "^8.5.0"

[[tool.poetry.source]]
name = "gitlab-pyrdp-commons"
url = "https://gitlab-intern.ait.ac.at/api/v4/projects/3611/packages/pypi/simple"
priority = "explicit"

[tool.coverage.paths]
source = ["data_crawler"]

[tool.coverage.run]
branch = true
source = ["data_crawler"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
datacrawler = "data_crawler.cli:main"
