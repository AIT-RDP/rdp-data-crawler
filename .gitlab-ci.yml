stages:
  - build
  - test
  - release

variables:
  # Keep in sync with the UV_VERSION build argument of docker/Dockerfile
  UV_VERSION: "0.12.1"
  # Version of the tool that derives the package version from the git history
  DUNAMAI_VERSION: "1.17.0"

include:
  - component: "$CI_SERVER_FQDN/ees/rdp/generic-components/rdp-cicd-components/kaniko@main"
    inputs:
      stage-test-image: test
      # No build arguments are needed anymore. All dependencies of the image are publicly available, hence the
      # MODBUS_GIT_USER, MODBUS_GIT_PASSWORD and TOKEN_PYRDP_COMMONS credentials became obsolete.
      build-args: ""

# =============================================================================
# Perform the unit test
# =============================================================================

test_python_3_10:
  stage: test
  needs: []  # no dependencies to precious pipelines stages
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/eclipse-mosquitto:2.1-alpine
      alias: mosquitto
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/redis
      alias: redis
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/influxdb:2
      alias: influxdb
      variables:
        DOCKER_INFLUXDB_INIT_MODE: "setup"
        DOCKER_INFLUXDB_INIT_USERNAME: ${DATA_CRAWLER_INFLUX_USER}
        DOCKER_INFLUXDB_INIT_PASSWORD: ${DATA_CRAWLER_INFLUX_PASSWORD}
        DOCKER_INFLUXDB_INIT_ORG: "ait"
        DOCKER_INFLUXDB_INIT_BUCKET: "ait-bucket"
  tags:
    - docker
    - x86_64
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:3.10
  variables:
    DATA_CRAWLER_MQTT_HOST: "mosquitto"
    DATA_CRAWLER_MQTT_PORT: "1883"
    DATA_CRAWLER_REDIS_HOST: "redis"
    DATA_CRAWLER_REDIS_PORT: "6379"
    DATA_CRAWLER_REDIS_DB: 0
    # InfluxDB connection settings for the InfluxDB source tests.
    DATA_CRAWLER_INFLUX_URL: "http://influxdb:8086"
    DATA_CRAWLER_INFLUX_ORG: "ait"
    DATA_CRAWLER_INFLUX_USER: ${DATA_CRAWLER_INFLUX_USER}
    DATA_CRAWLER_INFLUX_PASSWORD: ${DATA_CRAWLER_INFLUX_PASSWORD}
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
    UV_NO_PROGRESS: "1"
  cache:  # Reuse the downloaded wheels across pipeline runs
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  script:
    - pip install --no-cache-dir uv==${UV_VERSION}
    # Install the exact dependency set of uv.lock. All third-party dependencies are publicly available, hence no
    # repository credentials are required anymore.
    - uv sync --locked --all-extras
    # Test the code. The import paths are configured via [tool.pytest.ini_options] in pyproject.toml.
    - uv run pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml --log-cli-level=INFO test
    - uv cache prune --ci
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:  # Collect test results
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# =============================================================================
# Build the installable package
# =============================================================================

.build-package:
  stage: release
  tags:
    - docker
    - x86_64
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:3.10
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
    GIT_DEPTH: 0  # The full history including the tags is needed to derive the version
    UV_NO_PROGRESS: "1"
    UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
    UV_PUBLISH_USERNAME: "gitlab-ci-token"
    UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - pip install --no-cache-dir uv==${UV_VERSION}
    # Derive a unique PEP 440 version from the git history: the base is taken from the latest reachable tag, the
    # distance to that tag makes the version monotonic and the commit hash makes it unique for every build.
    - DST_VERSION=$(uvx dunamai@${DUNAMAI_VERSION} from git --format "${VERSION_FORMAT}")
    - echo Write destination version $DST_VERSION
    - uv version --frozen "$DST_VERSION"
    # Build the source distribution and the wheel
    - uv build
    # Push the package to the GitLab package registry (credentials are provided via the UV_PUBLISH_* variables)
    - uv publish

build-package-main:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}+{commit}"
  only:
    - main
    - master

build-package-development:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
  only:
    - development
    - 44-provide-python-packages-for-project-extension
