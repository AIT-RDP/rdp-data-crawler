stages:
  - build
  - test
  - release
  - cleanup

variables:
  CONTAINER_TEST_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  CONTAINER_MAIN_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest
  CONTAINER_DEVELOPMENT_RELEASE_IMAGE: $CI_REGISTRY_IMAGE:latest-dev

# =============================================================================
# Perform the unit test
# =============================================================================

test_python_3_10:
  stage: test
  needs: []  # no dependencies to precious pipelines stages
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/redis
      alias: redis
  tags:
    - docker
    - x86_64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  variables:
    DATA_CRAWLER_REDIS_HOST: "redis"
    DATA_CRAWLER_REDIS_PORT: "6379"
    DATA_CRAWLER_REDIS_DB: 0
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    # Authenticate the third-party dependencies
    - poetry config repositories.gitlab-intern-ees-lachs-modbus-crawler https://gitlab-intern.ait.ac.at/ees-lachs/modbus-crawler
    - poetry config http-basic.gitlab-intern-ees-lachs-modbus-crawler gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry config http-basic.gitlab-pyrdp-commons gitlab-ci-token ${CI_JOB_TOKEN}
    # Install the dependencies
    - poetry install --with dev --all-extras
    # Test the code
    - PYTHONPATH="${PYTHONPATH}:.:test" poetry run pytest --cov --cov-report term --cov-report xml:coverage.xml --junitxml=report.xml --log-cli-level=INFO test
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:  # Collect test results
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# =============================================================================
# Build the installable package
# =============================================================================

.build-package:
  stage: release
  tags:
    - docker
    - x86_64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
  script:
    - pip install -r requirements-dev.txt
    # Guess the version number (no versioneer needed)
    - DST_VERSION=$(dunamai from git --format "${VERSION_FORMAT}")
    - echo Write destination version $DST_VERSION
    - poetry version "$DST_VERSION"
    # Build the project
    - poetry build
    # Push the package
    - poetry config repositories.gitlab-intern ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry config http-basic.gitlab-intern gitlab-ci-token ${CI_JOB_TOKEN}
    - poetry publish --repository gitlab-intern

build-package-main:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}+{commit}"
  only:
    - main
    - master

build-package-development:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
  only:
    - development
    - 44-provide-python-packages-for-project-extension

# =============================================================================
# Create, test and push the docker images
#
# WARNING: These jobs execute on a shell runner. Take care not to crash the
#          system. Clean your trash and do not leaf any artefacts such as
#          docker images.
# =============================================================================

# Creates the docker image for productive use
build-images:
  stage: build
  tags:
    - baremetal
    - shell
  variables:
    DOCKER_PROXY_PREFIX: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/
  script:
    - docker info
    - docker login -u $CI_DEPENDENCY_PROXY_USER -p $CI_DEPENDENCY_PROXY_PASSWORD $CI_DEPENDENCY_PROXY_SERVER
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build --pull --file docker/Dockerfile -t $CONTAINER_TEST_IMAGE --build-arg MODBUS_GIT_USER --build-arg MODBUS_GIT_PASSWORD --build-arg TOKEN_PYRDP_COMMONS .
    - docker push $CONTAINER_TEST_IMAGE

# Template that pushes a release image to $CONTAINER_RELEASE_IMAGE
.release-image:
  stage: release
  tags:
    - baremetal
    - shell
  variables:
    CONTAINER_REGISTRY_USER: $CI_REGISTRY_USER
    CONTAINER_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    CONTAINER_REGISTRY: $CI_REGISTRY
  script:
    - docker info
    # Log in to the default registry holding the test image
    - echo "Try to login to the source registry  $CI_REGISTRY given the user $CI_REGISTRY_USER"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Log in to the external registry to push the release
    - echo "Try to login to the destination registry  $CONTAINER_REGISTRY given the user $CONTAINER_REGISTRY_USER"
    - docker login -u $CONTAINER_REGISTRY_USER -p $CONTAINER_REGISTRY_PASSWORD $CONTAINER_REGISTRY
    # Fetch the test image and publish it to the final registry
    - docker pull $CONTAINER_TEST_IMAGE
    - docker tag $CONTAINER_TEST_IMAGE $CONTAINER_RELEASE_IMAGE
    - docker push $CONTAINER_RELEASE_IMAGE

# Release the latest-tag
release-image-main:
  extends: .release-image
  variables:
    CONTAINER_RELEASE_IMAGE: $EXT_REGISTRY/$CI_PROJECT_NAME:latest
    CONTAINER_REGISTRY_USER: $EXT_REGISTRY_USER
    CONTAINER_REGISTRY_PASSWORD: $EXT_REGISTRY_PASSWORD
    CONTAINER_REGISTRY: $EXT_REGISTRY
  tags:
    - baremetal
    - shell
  only:
    - main
    - master

# release the latest-dev tag
release-image-tag:
  extends: .release-image
  variables:
    CONTAINER_RELEASE_IMAGE: $EXT_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_TAG
    CONTAINER_REGISTRY_USER: $EXT_REGISTRY_USER
    CONTAINER_REGISTRY_PASSWORD: $EXT_REGISTRY_PASSWORD
    CONTAINER_REGISTRY: $EXT_REGISTRY
  tags:
    - baremetal
    - shell
  rules:
    - if: $CI_COMMIT_TAG

# release the latest-dev tag
release-image-dev:
  extends: .release-image
  variables:
    CONTAINER_RELEASE_IMAGE: $EXT_REGISTRY/$CI_PROJECT_NAME:latest-dev
    CONTAINER_REGISTRY_USER: $EXT_REGISTRY_USER
    CONTAINER_REGISTRY_PASSWORD: $EXT_REGISTRY_PASSWORD
    CONTAINER_REGISTRY: $EXT_REGISTRY
  tags:
    - baremetal
    - shell
  only:
    - development

# Removes any local docker image to avoid littering the build host
cleanup-images:
  stage: cleanup
  tags:
    - baremetal
    - shell
  script:
    - docker info
    # all images are tagged by the local registry, anyway. Hence, there is no need to explicitly search for remote ones
    - docker images --filter=reference="${CI_REGISTRY_IMAGE}"
    - docker rmi -f $(docker images --filter=reference="${CI_REGISTRY_IMAGE}" -q)
    - docker images
  when: always
